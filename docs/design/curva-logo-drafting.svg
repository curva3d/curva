<?xml version="1.0" encoding="UTF-8"?>
<!-- Curva logo, "Drafting" variation (2b). 256 x 256 artboard. Each top-level group opens as a layer in
     Adobe Illustrator, named by its id; sublayers likewise. Everything is plain paths, with no symbols
     or references, so every element can be edited directly. Colours: tile #FAF9F5 with edge #E2DFD5,
     guides #1F1E1D at 12% opacity, C #1F1E1D, control polygon and points #E0782F. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <g id="Tile" data-name="Tile">
    <rect id="Tile_fill" data-name="Tile fill" x="8.5" y="8.5" width="239" height="239" rx="52" ry="52" fill="#FAF9F5" stroke="#E2DFD5" stroke-width="1"/>
  </g>

  <g id="Construction_guides" data-name="Construction guides" fill="none" stroke="#1F1E1D" stroke-opacity="0.12" stroke-width="1">
    <g id="Grid" data-name="Grid">
      <line x1="32" y1="8" x2="32" y2="248"/>
      <line x1="64" y1="8" x2="64" y2="248"/>
      <line x1="96" y1="8" x2="96" y2="248"/>
      <line x1="128" y1="8" x2="128" y2="248"/>
      <line x1="160" y1="8" x2="160" y2="248"/>
      <line x1="192" y1="8" x2="192" y2="248"/>
      <line x1="224" y1="8" x2="224" y2="248"/>
      <line x1="8" y1="32" x2="248" y2="32"/>
      <line x1="8" y1="64" x2="248" y2="64"/>
      <line x1="8" y1="96" x2="248" y2="96"/>
      <line x1="8" y1="128" x2="248" y2="128"/>
      <line x1="8" y1="160" x2="248" y2="160"/>
      <line x1="8" y1="192" x2="248" y2="192"/>
      <line x1="8" y1="224" x2="248" y2="224"/>
    </g>
    <g id="Circles" data-name="Circles">
      <circle id="Outer_circle" data-name="Outer circle" cx="128" cy="128" r="104"/>
      <circle id="Inner_circle" data-name="Inner circle" cx="128" cy="128" r="64"/>
    </g>
    <rect id="Square" data-name="Square" x="40" y="40" width="176" height="176"/>
    <g id="Diagonals" data-name="Diagonals">
      <line x1="8" y1="8" x2="248" y2="248"/>
      <line x1="248" y1="8" x2="8" y2="248"/>
    </g>
  </g>

  <g id="Control_polygon" data-name="Control polygon">
    <polyline points="194.55,72.85 61.4,128 194.55,183.15" fill="none" stroke="#E0782F" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g id="C" data-name="C">
    <!-- An arc of radius 78 about (139.4, 128), from +45° round to -45°, 38 wide with round caps. -->
    <path d="M 194.55 72.85 A 78 78 0 1 0 194.55 183.15" fill="none" stroke="#1F1E1D" stroke-width="38" stroke-linecap="round"/>
  </g>

  <g id="Control_points" data-name="Control points" fill="#E0782F">
    <circle id="Point_top" data-name="Point top" cx="194.55" cy="72.85" r="10"/>
    <circle id="Point_left" data-name="Point left" cx="61.4" cy="128" r="10"/>
    <circle id="Point_bottom" data-name="Point bottom" cx="194.55" cy="183.15" r="10"/>
  </g>
</svg>
