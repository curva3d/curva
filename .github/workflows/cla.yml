name: CLA

# Asks every new contributor to sign CLA.md once, by commenting on their pull request, and fails
# the check until they have (decision 0026). Signatures are stored in signatures/cla.json on the
# cla-signatures branch, so main's history and CI are not touched by them.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the Curva CLA and I hereby sign it.'))
    steps:
      # contributor-assistant/github-action v2.6.1, pinned to its commit because this workflow
      # runs with write access on pull requests from forks. It never checks out pull request code.
      # The upstream repository is archived but the release works; replace it if it ever breaks.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/curva3d/curva/blob/main/CLA.md
          branch: cla-signatures
          # The owner's own account (agents commit through it) and bots need no signature.
          allowlist: lourencovp,dependabot[bot],github-actions[bot],claude[bot],bot*
          custom-pr-sign-comment: I have read the Curva CLA and I hereby sign it.
          custom-notsigned-prcomment: >-
            Thank you for your contribution to Curva. Before it can be merged, please read the
            [Contributor Licence Agreement](https://github.com/curva3d/curva/blob/main/CLA.md)
            and sign it by commenting below with the sentence shown. You only do this once.
          custom-allsigned-prcomment: Everyone in this pull request has signed the Curva CLA. Thank you.
          lock-pullrequest-aftermerge: false
