name: Weakened tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  weakened-tests:
    name: weakened tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for weakened tests
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          findings=$(bash .github/scripts/weakened-tests.sh "$BASE" "$HEAD")
          if [ -z "$findings" ]; then
            echo "No weakened tests found."
            exit 0
          fi
          printf '%s\n' "$findings"
          {
            echo "**This pull request may weaken the tests.** An agent must stop and ask the owner in chat before merging."
            echo
            printf '%s\n' "$findings"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none
          exit 1
