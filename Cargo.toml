[workspace]
members = ["crates/*", "evaluation/harness"]
exclude = ["crates/curva-mesh/vendor", "crates/curva-kernel/vendor"] # patched copies of libraries, linted by their authors
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/curva3d/curva"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
