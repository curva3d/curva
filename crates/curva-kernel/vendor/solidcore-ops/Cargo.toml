# A copy of solidcore-ops from tangency-labs/solidcore at commit 9342f32c0770aeaa570dba596e4ed2b7fe327849,
# with one change (curva.patch): `session::with_own_kernel`, so independent work on several
# threads no longer waits for the one process kernel. Delete this copy once solidcore has the fix
# and Curva's tests and timings pass on it (decision 0037).
[package]
name = "solidcore-ops"
description = "The modelling operations applications built on solidcore call: each a sequence of kernel calls, converting through solidcore-convert, computing no geometry of its own"
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
publish = false
rust-version = "1.88"
repository = "https://github.com/tangency-labs/solidcore"
include = ["Cargo.toml", "LICENSE", "NOTICE", "README.md", "curva.patch", "src/**/*.rs"]

[dependencies]
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "9342f32c0770aeaa570dba596e4ed2b7fe327849" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "9342f32c0770aeaa570dba596e4ed2b7fe327849" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "9342f32c0770aeaa570dba596e4ed2b7fe327849" }

[features]
profile = ["solidcore/profile"]
