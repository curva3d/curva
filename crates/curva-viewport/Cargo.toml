[package]
name = "curva-viewport"
description = "Curva's 3D viewport."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
curva-document = { path = "../curva-document" }
curva-kernel = { path = "../curva-kernel" }
# Fills annotations' letters and arrowheads with triangles (decision 0030).
lyon_tessellation = "1.0"
egui-wgpu = "0.37"
epaint = "0.37"
png = "0.18"
pollster = "0.4"
# Meshes many solids at once on all cores, as the architecture asks (section 7). Already in the
# build through the engine.
rayon = "1.12"
# The Bevy pilot (decision 0028, docs/specs/bevy-pilot.md): pinned, upgraded only with egui's wgpu.
# Rendering parts only: no windows, audio, user interface, logging, scenes or picking.
bevy = { version = "=0.20.1", default-features = false, features = ["std", "multi_threaded", "async_executor", "bevy_asset", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_camera", "bevy_mesh", "bevy_anti_alias", "bevy_post_process", "tonemapping_luts", "smaa_luts", "ktx2", "zstd_rust", "bluenoise_texture"] }
