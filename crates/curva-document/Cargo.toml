[package]
name = "curva-document"
description = "Objects, selection, undo and files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
curva-kernel = { path = "../curva-kernel" }
serde = { version = "1", features = ["derive"] }
# Exact numbers in files: a body read back a hair off can differ from the one saved.
serde_json = { version = "1", features = ["float_roundtrip"] }
