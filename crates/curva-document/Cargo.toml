[package]
name = "curva-document"
description = "Objects, selection, undo and files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
curva-kernel = { path = "../curva-kernel" }
serde = { version = "1", features = ["derive", "rc"] }
# Exact numbers in files: a body read back a hair off can differ from the one saved.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The .curva file is a zip package (decision 0015). Only deflate, through zlib-rs, which is pure
# Rust; none of the C compressors.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The date and time in the computer's time zone for text fields (spec `annotation.md` §2): the
# standard library has no time zones. Pure Rust; Unlicense OR MIT. The zone data is bundled only on
# Windows, which has none in the form needed.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }
