[package]
name = "curva-app"
description = "The Curva application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
curva-commands = { path = "../curva-commands" }
curva-document = { path = "../curva-document" }
curva-kernel = { path = "../curva-kernel" }
curva-mcp = { path = "../curva-mcp" }
curva-viewport = { path = "../curva-viewport" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# The panel arrangement is kept as a small JSON file. Both are already in the build through
# curva-document.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads Curva's icon for the window. Already in the build through curva-viewport.
png = "0.18"
# Checks a downloaded update against the checksums its release lists.
sha2 = "0.10"
# The system's own file dialogs for Open, Save and the rest (spec `feedback-0.4.2.md` §1): Explorer's,
# Finder's, and the desktop's through the XDG portal on Linux. MIT.
rfd = "0.18"
# Waits for a file dialog on a worker thread, so Curva keeps drawing. Already in the build.
pollster = "0.4"

# Puts Curva's icon into the Windows program, so Explorer and the task bar show it. Build time only.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
