[package]
name = "curva-app"
description = "The Curva application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
curva-commands = { path = "../curva-commands" }
curva-document = { path = "../curva-document" }
curva-kernel = { path = "../curva-kernel" }
curva-mcp = { path = "../curva-mcp" }
curva-viewport = { path = "../curva-viewport" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# The panel arrangement is kept as a small JSON file. Both are already in the build through
# curva-document.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
