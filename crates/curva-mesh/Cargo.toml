[package]
name = "curva-mesh"
description = "Curva's mesh and SubD objects, and the one place that calls the mesh libraries."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
curva-kernel = { path = "../curva-kernel" }
serde = { version = "1", features = ["derive"] }
# Mesh booleans and repair (decision 0032, spec §3.1). Apache-2.0; brings clipper2-rust (BSL-1.0,
# decision 0034). `parallel` gives the same answers as one thread, faster.
manifold-rust = { version = "=0.19.2", features = ["parallel"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
