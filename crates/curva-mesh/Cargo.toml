[package]
name = "curva-mesh"
description = "Curva's mesh and SubD objects, and the one place that calls the mesh libraries."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
curva-kernel = { path = "../curva-kernel" }
serde = { version = "1", features = ["derive"] }
# Mesh booleans and repair (decision 0032, spec §3.1). Apache-2.0; brings clipper2-rust (BSL-1.0,
# decision 0034). `parallel` gives the same answers as one thread, faster.
manifold-rust = { version = "=0.19.2", features = ["parallel"] }
# SubD smoothing and the limit surface (decision 0032, spec §3.2). MIT, Apache-2.0, Zlib or
# BSD-3-Clause. Its Bevy and graphics-card features are not used (they target an older Bevy).
subdiv-kernels = { version = "=0.1.0", default-features = false }
# QuadRemesh (decision 0033, spec §3.5). MIT. A patched copy of quadrs 1.0.0 in vendor/quadrs:
# quadrs gave slightly different quads from one run to the next (hash map order), so the copy uses
# ordered maps. Offered to its author in vidstige/quadrs#1; when a release has the fix, go back to
# `quadrs = "=<that version>"` and delete vendor/ (issue #349, decision 0036).
quadrs = { path = "vendor/quadrs" }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
