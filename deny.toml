[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # Owner approved 16 November 2026 (Bevy pilot, #228): MIT without its credit condition; Bevy
    # needs it through encase.
    "MIT-0",
    # Owner approved 17 November 2026 for all of Curva (decision 0034): the Boost licence, as
    # permissive as MIT; first needed by manifold-rust through clipper2-rust.
    "BSL-1.0",
]

# Owner approved 9 November 2026 (PR #33): font licences, for egui's bundled fonts only.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# Owner approved 14 November 2026 (decision 0021, point 5): MPL-2.0 for acadrust alone, used
# unmodified for DXF and DWG files.
[[licenses.exceptions]]
crate = "acadrust"
allow = ["MPL-2.0"]

# Owner decided 15 November 2026 (decision 0025): Curva's own application crates are
# GPL-3.0-or-later. Only these four; outside libraries stay on the list above.
[[licenses.exceptions]]
crate = "curva-app"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "curva-commands"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "curva-viewport"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "curva-mcp"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Only for links between Curva's own unpublished crates; outside libraries stay strict.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# OpenSKP: SketchUp files (owner, 18 November 2026). The crates.io name `openskp` is another, GPL
# project, so it comes from its repository at a fixed commit.
allow-git = ["https://github.com/tangency-labs/solidcore", "https://github.com/iamahsanmehmood/openskp"]
