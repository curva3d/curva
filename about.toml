# cargo-about: lists every library in a Curva build with its licence text,
# for THIRD-PARTY-LICENSES.html in each release. Keep in step with deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# MPL-2.0 for acadrust alone (decision 0021, point 5), as in deny.toml.
[acadrust]
accepted = ["MPL-2.0"]

# Curva's own application crates are GPL-3.0-or-later (decision 0025), as in deny.toml.
[curva-app]
accepted = ["GPL-3.0-or-later"]

[curva-commands]
accepted = ["GPL-3.0-or-later"]

[curva-viewport]
accepted = ["GPL-3.0-or-later"]

[curva-mcp]
accepted = ["GPL-3.0-or-later"]
