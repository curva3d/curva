# Spike for #199: viewport-lib as Curva's 3D viewport. Not part of Curva's workspace or build;
# not merged.
[package]
name = "viewport-lib-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
viewport-lib = { version = "=0.24.0", default-features = false, features = ["wgpu30"] }
glam = "0.30"
curva-kernel = { path = "../../crates/curva-kernel" }
curva-document = { path = "../../crates/curva-document" }
curva-viewport = { path = "../../crates/curva-viewport" }
pollster = "0.4"
png = "0.18"
